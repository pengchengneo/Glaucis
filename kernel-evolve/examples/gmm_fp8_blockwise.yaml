kernel:
  name: "gmm_fp8_blockwise"
  template: "kernels/gmm_fp8_blockwise.py"
  reference: "kernels/gmm_fp8_blockwise_ref.py"
  evolve_markers:
    start: "# EVOLVE-BLOCK-START"
    end: "# EVOLVE-BLOCK-END"

# AL model production shapes (64 chip v7x, EP=1):
#   global_batch=5120, GA=4, seq_len=4096, top_k=8, num_experts=256
#   M = (5120/4) * 4096 * 8 / 128 = 327,680
#   G = 256/EP = 256, per_expert = 1,280
#   wi: fuse_gate_up=true → N=2*512=1024
#   Gate/Up: lhs [327680, 2048] @ rhs [256, 2048, 1024]
#   Down:    lhs [327680, 512]  @ rhs [256, 512, 2048]
shapes:
  - { M: 327680, K: 2048, N: 1024, G: 256 }  # wi (Gate/Up fused)
  - { M: 327680, K: 512, N: 2048, G: 256 }    # wo (Down)

correctness:
  method: "allclose"
  # Both kernel and reference use the same FP8 baseline config, so max_diff
  # should be ~0. Small tolerance for floating point non-determinism.
  rtol: 1e-2
  atol: 1.0

evaluator:
  namespace: "default"
  job_template: ".github/ci/kernel-eval-gmm-job.yaml"
  repo: "primatrix/Glaucis"
  branch: "pallas-evolve/gmm-fp8-prod-shapes"
  poll_interval: 15
  timeout: 1200

tpu:
  cluster: "tpu7x-cluster"
  zone: "us-central1"

session:
  max_iterations: 20
  output_dir: "runs/gmm_fp8_blockwise"

batch:
  variants_per_round: 5
  top_k: 2
  max_active_lineages: 4
